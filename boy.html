<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Hey Love...</h1>

        <p>This is for you ❤️</p>

        <div class="box">
            <h2>🔐 Enter the Password</h2>

            <p class="hint">
                A little clue... Can you remember the day
                our story quietly began with our very first conversation? ❤️
            </p>

            <input 
                type="password" 
                id="password"
                placeholder="Enter our special password"
            >

            <button onclick="checkPassword()">
                Unlock My Heart ❤️
            </button>

            <p id="message"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
